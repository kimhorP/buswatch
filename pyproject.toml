[project]
name = "buswatch"
version = "0.1.0"
description = "Telegram bot that watches Cambodian bus ticket availability"
readme = "README.md"
authors = [
    { name = "phoeurnkimhor", email = "phoeurnkimhor@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "selectolax>=1.0.1",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
